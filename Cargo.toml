[package]
name = "rust-event-stream"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = "0.7"
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
tower-http = { version = "0.6", features = ["timeout", "limit", "trace"] } 
tower = { version = "0.5.3", features = ["limit", "load-shed", "timeout", "buffer"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono", "json"] }
serde_json = "1.0.151"
async-trait = "0.1.92"
dotenvy = "0.15.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
