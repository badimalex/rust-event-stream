[package]
name = "rust-event-stream"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
tower-http = { version = "0.6", features = ["timeout", "limit"] } 
tower = { version = "0.5.3", features = ["limit", "load-shed", "timeout", "buffer"] }
